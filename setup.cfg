[metadata]
name = conformal-demand-risk
version = 0.1.0
description = Conformal prediction intervals for demand forecasting and inventory risk
author = Rohith Vairavel

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    pandas>=2.0
    scikit-learn>=1.3
    lightgbm>=4.0
    matplotlib>=3.7
    joblib>=1.3
    streamlit>=1.28

[options.packages.find]
where = src
